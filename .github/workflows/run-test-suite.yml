name: Run Test Suite

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Choose the environment to run your tests'
        options:
          - 'qa'
          - 'stage'
        default: 'qa'
      xmlFileName:
        type: choice
        description: 'Choose the TestNG XML suite file to run'
        options:
          - 'testng'
          - 'smoke'
        default: 'testng'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Test Suite
        continue-on-error: true
        run: |
          echo "Running suite   : ${{ github.event.inputs.xmlFileName }}.xml"
          echo "Environment     : ${{ github.event.inputs.environment }}"
          mvn clean test \
            "-DxmlFileName=${{ github.event.inputs.xmlFileName }}" \
            "-Denviroment=${{ github.event.inputs.environment }}"

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.14
        if: always()
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 5

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          personal_token: ${{ secrets.GH_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v18
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: harshhpatel07@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: harshhpatel07@gmail.com
          to: harshvegada1997@gmail.com,write2technocredits@gmail.com
          subject: 'Test Run [${{ github.event.inputs.xmlFileName }}] on [${{ github.event.inputs.environment }}] - ${{ github.repository }}'
          body: |
            Hi everyone,

            The test suite "${{ github.event.inputs.xmlFileName }}.xml" has completed on the "${{ github.event.inputs.environment }}" environment.

            Allure Report: https://harshvegada.github.io/MAY25_HRM_API_BDD/${{ github.run_number }}

            Thanks & Regards
            TechnoCredits
