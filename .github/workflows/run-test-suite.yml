name: Run Test Suite

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Choose the environment to run tests
        type: choice
        options:
          - qa
          - stage
        default: qa

      xmlFileName:
        description: Choose the TestNG suite
        type: choice
        options:
          - testng
          - smoke
        default: testng

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Test Suite
        if: always()
        continue-on-error: true
        run: |
          echo "Suite        : ${{ github.event.inputs.xmlFileName }}"
          echo "Environment  : ${{ github.event.inputs.environment }}"

          mvn clean test \
            -DxmlFileName=${{ github.event.inputs.xmlFileName }} \
            -Denvironment=${{ github.event.inputs.environment }}

      - name: Checkout gh-pages
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.14
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 5

      - name: Deploy Allure Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true
          enable_jekyll: false

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASS }}

          from: ${{ secrets.EMAIL_USERNAME }}
          to: harshvegada1997@gmail.com,write2technocredits@gmail.com

          subject: Test Run [${{ github.event.inputs.xmlFileName }}] on [${{ github.event.inputs.environment }}] - ${{ github.repository }}

          body: |
            Hi Everyone,

            The test suite "${{ github.event.inputs.xmlFileName }}.xml" has completed successfully.

            Environment:
            ${{ github.event.inputs.environment }}

            Repository:
            ${{ github.repository }}

            Workflow Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Allure Report:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            Thanks & Regards
            TechnoCredits